# =============================================================================
# CI/CD Pipeline (single workflow)
# =============================================================================
# Triggered:
#   - On every PR (whatever the target branch).
#   - On every push to `develop` or `main`.
#
# All stages are wired together via `needs:`. Failures stop the pipeline; CD
# stages NEVER run if any CI stage failed because they literally depend on
# the preceding job tree.
#
# Stages:
#   lint -> typecheck -> test ┬ build-verify   (on PR only; no publish)
#                              └ build-publish (on push only)
#                                       └ deploy-develop (push to develop)
#                                       └ deploy-prod    (push to main)
#
# What the pipeline does per push to a protected branch:
#   - Validates the change (lint / typecheck / test).
#   - Builds an immutable Docker image tagged with the commit SHA and pushes
#     it to GCP Artifact Registry.
#   - Deploys that image to the matching Cloud Run service. Per-environment
#     differences live in env vars / secrets injected at runtime.
#
# Note: in this gitflow `develop` (integration of WIP features) and `main`
# (merged stable) hold genuinely different code at any moment, so each push
# produces ITS OWN artifact for ITS environment. We are NOT promoting one
# image across environments — the value is immutability, traceability and
# fast rollback.
#
# ----------------------------------------------------------------------------
# STATUS: scaffolded but NOT YET ACTIVE for build/deploy stages.
# Every GCP step in `build-publish` and `deploy-*` is commented out so the
# workflow runs green until the repo configures secrets/variables (see
# `.github/workflows/README.md`). Uncomment the blocks marked
# `# ---- Uncomment everything below ...` once GCP is set up.
# ----------------------------------------------------------------------------
# =============================================================================

name: CI/CD

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel previous runs from the same PR to avoid wasted compute. Do NOT cancel
# in-progress runs from pushes (deploy must not be left half-applied).
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write       # required to create release tags
  id-token: write       # required for Workload Identity Federation (GCP auth)
  pull-requests: write
  checks: write

# Opt every javascript action into the Node.js 24 runtime ahead of the
# 2026-06-02 default switch, so we are not affected by the Node 20 deprecation
# warning on `actions/checkout@v4` and similar actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

