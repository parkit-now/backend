# =============================================================================
# CI/CD Pipeline (single workflow)
# =============================================================================
# Triggered:
#   - On every PR (whatever the target branch).
#   - On every push to `develop` or `main`.
#
# All stages are wired together via `needs:`. Failures stop the pipeline; CD
# stages NEVER run if any CI stage failed because they literally depend on
# the preceding job tree.
#
# Stages:
#   lint -> typecheck -> test
#
# What the pipeline does per push to a protected branch:
#   - Validates the change (lint / typecheck / test).
#
# Note: in this gitflow `develop` (integration of WIP features) and `main`
# (merged stable) hold genuinely different code at any moment, so each push
# produces ITS OWN artifact for ITS environment. We are NOT promoting one
# image across environments — the value is immutability, traceability and
# fast rollback.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel previous runs from the same PR to avoid wasted compute. Do NOT cancel
# in-progress runs from pushes (deploy must not be left half-applied).
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write       # required to create release tags
  id-token: write       # required for Workload Identity Federation (GCP auth)
  pull-requests: write
  checks: write

# Opt every javascript action into the Node.js 24 runtime ahead of the
# 2026-06-02 default switch, so we are not affected by the Node 20 deprecation
# warning on `actions/checkout@v4` and similar actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ===========================================================================
  # CI: MIGRATIONS — el orden de supabase/migrations tiene que ser aplicable
  # ===========================================================================
  #
  # Va PRIMERO y sin `needs:`: es el chequeo más barato (segundos, sin instalar
  # nada) y el único que protege producción de un merge que después no se puede
  # desplegar. Una migración con timestamp anterior a la última ya mergeada
  # hace que `supabase db push` se plante y exija `--include-all`, que la aplica
  # fuera de orden. Ya pasó: dejó producción 5 migraciones atrás y el backend
  # desplegado devolviendo 404 porque Prisma pedía columnas inexistentes.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El chequeo compara contra la rama base: sin historia completa no hay
          # con qué comparar y el script se saltea el control en silencio.
          fetch-depth: 0

      - name: Check migration order
        run: ./scripts/check-migrations.sh

  # ===========================================================================
  # CI: LINT — formatting and static rules
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # `bun install` dispara el postinstall (`prisma generate`), que es lo que
      # hace existir a `@prisma/client` con el schema actual. Sin esto el
      # typecheck falla con errores fantasma tipo "Property X does not exist".
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `lint:check` y NO `lint`: este último lleva `--fix`, que en CI
      # auto-corrige, deja el job en verde y esconde el problema.
      - name: ESLint
        run: bun run lint:check

      - name: Prettier
        run: bunx prettier --check "src/**/*.ts"

  # ===========================================================================
  # CI: TYPE CHECK — static type verification
  # ===========================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tsc --noEmit` sobre TODO, specs incluidos. `nest build` los excluye y
      # `bun test` ejecuta TS sin chequear tipos, así que sin este paso los
      # errores de tipo en los tests son literalmente invisibles.
      - name: TypeScript
        run: bun run typecheck

  # ===========================================================================
  # CI: TEST — unit tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sin `services:` a propósito: la suite mockea Prisma y no toca la base.
      # Si algún día se suman tests de integración, acá va el service de
      # postgres.
      - name: Bun test
        run: bun test

  # ===========================================================================
  # CI: BUILD — the artifact must actually compile
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Nest build
        run: bun run build
